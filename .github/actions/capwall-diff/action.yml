name: "Capwall capability diff"
description: "Diff package capabilities between the base branch and this PR. Posts a comment showing exactly what new permissions a dependency change requests."
inputs:
  github-token:
    description: "GitHub token for posting PR comments"
    required: true
    default: ${{ github.token }}
  base:
    description: "Base branch to compare against"
    required: false
    default: ${{ github.base_ref }}
  fail-on-new-capabilities:
    description: "Exit 1 if new capabilities are detected (merge gate)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install capwall
      shell: bash
      run: npm install -g @extodan/capwall

    - name: Scan base branch
      shell: bash
      run: |
        git fetch origin ${{ inputs.base }} --depth=1
        git worktree add /tmp/base origin/${{ inputs.base }}
        cd /tmp/base
        npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts --no-audit --no-fund 2>/dev/null || true
        capwall init 2>/dev/null || echo '{}' > capabilities.lock
        cp capabilities.lock /tmp/base-lock.json

    - name: Scan PR branch
      shell: bash
      run: |
        npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts --no-audit --no-fund 2>/dev/null || true
        capwall init 2>/dev/null || echo '{}' > capabilities.lock
        cp capabilities.lock /tmp/head-lock.json

    - name: Diff capabilities
      id: diff
      shell: bash
      run: |
        DIFF=$(capwall diff --base /tmp/base-lock.json --head /tmp/head-lock.json) || true
        echo "diff<<EOF" >> $GITHUB_OUTPUT
        echo "$DIFF" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        if echo "$DIFF" | grep -q "NEW CAPABILITY"; then
          echo "has_new=true" >> $GITHUB_OUTPUT
        else
          echo "has_new=false" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const diff = `${{ steps.diff.outputs.diff }}`;
          const hasNew = `${{ steps.diff.outputs.has_new }}` === 'true';
          const body = hasNew
            ? `## Capwall: new permissions requested\n\n${diff}\n\n---\n*Checked by [Capwall](https://capwall.extodan.com) · review permissions, not just code.*`
            : `## Capwall: no capability changes\n\n${diff}\n\n---\n*Checked by [Capwall](https://capwall.extodan.com)*`;

          // Find and update our own comment only (never touch the GitHub App bot's comment)
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body.includes('Checked by'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Gate (exit 1 on new capabilities)
      if: ${{ inputs.fail-on-new-capabilities == 'true' && steps.diff.outputs.has_new == 'true' }}
      shell: bash
      run: |
        echo "::error::New capabilities detected — security owner approval required"
        exit 1
